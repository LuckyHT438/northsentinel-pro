name: 🍁 NorthSentinel CA Only

on:
  workflow_dispatch:  # Déclenchement manuel pour tests uniquement

jobs:
  scan-ca:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests yfinance beautifulsoup4 pytz urllib3

      - name: Run CA Scanner
        env:
          TELEGRAM_CA_TOKEN: ${{ secrets.TELEGRAM_CA_ONLY_TOKEN }}
          TELEGRAM_CA_CHAT_ID: ${{ secrets.TELEGRAM_CA_CHAT_ID }}
        run: python scanner_ca.py
