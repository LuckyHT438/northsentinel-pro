name: 🍁 NorthSentinel CA Only

on:
  workflow_dispatch:

concurrency:
  group: northsentinel-scan
  cancel-in-progress: false

jobs:
  scan-ca:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests yfinance beautifulsoup4 pytz urllib3 pandas

      - name: Run CA Scanner
        env:
          TELEGRAM_CA_TOKEN: ${{ secrets.TELEGRAM_CA_ONLY_TOKEN }}
          TELEGRAM_CA_CHAT_ID: ${{ secrets.TELEGRAM_CA_CHAT_ID }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          PYTHONUNBUFFERED: "1"     # ← Logs visibles en temps réel
        run: python scanner_ca.py
