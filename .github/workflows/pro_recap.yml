name: 🤖 NorthSentinel Pro Recap

on:
  workflow_dispatch:

jobs:
  run-pro-recap:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Pour le push éventuel (si le recap génère des fichiers)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ⬇️ NOUVELLE ÉTAPE : Récupérer les signaux depuis le dépôt de données
      - name: Fetch signals from data repo
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          if [ -n "$DATA_REPO_TOKEN" ]; then
            git clone https://x-access-token:${DATA_REPO_TOKEN}@github.com/LuckyHT438/northsentinel-data.git data-repo
            # Copier le fichier s'il existe
            cp data-repo/pro_signals_today.json . || echo "ℹ️ Aucun signal trouvé dans le dépôt de données"
          else
            echo "⚠️ DATA_REPO_TOKEN manquant, impossible de récupérer les signaux"
          fi

      - name: Run Recap
        env:
          TELEGRAM_PRO_TOKEN: ${{ secrets.TELEGRAM_PRO_TOKEN }}
          TELEGRAM_PRO_CHAT_ID: ${{ secrets.TELEGRAM_PRO_CHAT_ID }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          PUBLIC_CHANNEL_ID: ${{ secrets.PUBLIC_CHANNEL_ID }}
        run: python pro_post_market_recap.py
