name: 🤖 NorthSentinel Pro

on:
  workflow_dispatch:

jobs:
  run-pro-scalper:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # ← AJOUT : Permet de pousser pro_signals_today.json vers le dépôt de données

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Pro Scalper
        env:
          TELEGRAM_PRO_TOKEN: ${{ secrets.TELEGRAM_PRO_TOKEN }}
          TELEGRAM_PRO_CHAT_ID: ${{ secrets.TELEGRAM_PRO_CHAT_ID }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}          # ← AJOUT : Pour pousser les signaux vers northsentinel-data
          PUBLIC_CHANNEL_ID: ${{ secrets.PUBLIC_CHANNEL_ID }}      # ← AJOUT : Pour envoyer le recap au canal public
        run: python northsentinel_pro.py
